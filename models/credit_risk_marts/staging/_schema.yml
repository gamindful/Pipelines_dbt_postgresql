version: 2

models:
  - name: stg_credit_risk__credit_default
    description: "Cleaned, cast, decoded pass-through of credit_risk.credit_default."
    columns:
      - name: client_id
        data_tests: [not_null, unique]
      - name: education
        description: "Decoded label; undocumented raw codes (0, 5, 6) collapse to 'other'."
        data_tests:
          - accepted_values:
              values: ['graduate_school', 'university', 'high_school', 'other']
      - name: marriage
        description: "Decoded label; undocumented raw code (0) collapses to 'other'."
        data_tests:
          - accepted_values:
              values: ['married', 'single', 'other']
      - name: default_next_month
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]

  - name: stg_credit_risk__german_credit
    description: "Cleaned, cast, A-code-decoded pass-through of credit_risk.german_credit."
    columns:
      - name: applicant_id
        data_tests: [not_null, unique]
      - name: credit_risk_class
        data_tests:
          - not_null
          - accepted_values:
              values: ['good', 'bad']
